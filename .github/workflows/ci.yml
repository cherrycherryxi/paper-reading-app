name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python and frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5 # a few commits back, enough for the failure-triage step to compare recent history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Public repository scan
        run: |
          ! grep -R -n -E "log_server\\.py|paper_reading_backend|192\\.168\\.|/Users/huangnanqi" \
            app_server.py reading_mcp_server.py mcp_dispatcher.py tool_schema_provider.py \
            README.md CLAUDE.md .gitignore index.html app.js chat.js

      - name: Run Python tests
        run: python -m unittest discover -s tests/agent -p '*_test.py'

      - name: Run frontend tests
        run: node --test tests/frontend/*.test.js


  codex-autofix:
    name: Codex auto-fix failed feature push
    needs: test
    # Paused during the Codex -> CCDS migration. Keep the job definition for a
    # deliberate future replacement; ordinary CI remains active above.
    if: >-
      ${{ false && needs.test.result == 'failure' && github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/agent' }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose and prepare a repair PR with Codex
        if: env.OPENAI_API_KEY != ''
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/ci-autofix.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: --ephemeral
          output-file: codex-ci-autofix.md

      - name: Upload Codex repair report
        uses: actions/upload-artifact@v4
        with:
          name: codex-ci-autofix-${{ github.run_id }}
          path: codex-ci-autofix.md
          if-no-files-found: warn
