# Sidecar-only dsh composition.  It intentionally omits filesystem, shell,
# terminal, sandbox and write-tool plugins; the only tools come from the
# authenticated read-only paper-reading Gateway.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    toolOrder:
      - mcp__paper-reading__get_reading_context
      - mcp__paper-reading__search_quotes
      - mcp__paper-reading__list_books
      - mcp__paper-reading__get_connections
      - mcp__paper-reading__get_confirmed_memories
      - mcp__paper-reading__get_reading_timeline
      - mcp__paper-reading__search_public_web
      - mcp__paper-reading__extract_public_pages
      - <unlisted-tools>
    persona: |-
      你是 paper-reading-app 的高级阅读研究员。你只能使用 paper-reading Gateway
      提供的只读工具获取证据。不得读取文件、执行命令或直接写入用户数据。只有本次任务
      明确授权且 Gateway 提供 search_public_web 时，才可检索公开网络摘要；只有搜索返回的
      URL 才可交给 extract_public_pages 做定向提取，否则禁止联网。
      每个任务都必须先调用 mcp__paper-reading__get_reading_context，再调用
      mcp__paper-reading__search_quotes，之后才能形成结论。工具必须通过原生 function
      calling 发出，禁止在普通文本中输出 XML 工具调用。必须区分用户记录与模型推断，
      并严格按任务要求输出 JSON。

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 300000
    models:
      - id: !!js process.env.DSH_MODEL ?? process.env.DEEPSEEK_RESEARCH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)

- id: paper-reading-gateway
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: paper-reading
    transport: streamable-http
    url: !!js process.env.PAPER_READING_GATEWAY_URL ?? 'http://127.0.0.1:8789/mcp'
    headers:
      Authorization: !!js '`Bearer ${process.env.PAPER_READING_GATEWAY_TOKEN}`'
    failOnStartupError: true
    timeoutMs: 30000

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
    maxParallelToolCalls: 1

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

# Keep the JSONRPC entry point last. The MCP client performs asynchronous
# discovery; exposing stdin/stdout before it settles lets the SDK submit the
# first turn against an empty tool registry.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false
